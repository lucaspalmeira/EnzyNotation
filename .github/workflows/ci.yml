name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test and coverage
        run: python -m pytest --cov=enzynotation --cov-report=term --cov-fail-under=90
      - name: Schema contracts
        run: python -m pytest tests/test_schemas.py
      - name: Deterministic E2E
        run: python -m pytest tests/integration/test_end_to_end.py
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
